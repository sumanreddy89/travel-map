name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check server, web and Remotion
        run: |
          npx tsc -p server --noEmit
          npx tsc -p web/tsconfig.app.json --noEmit
          npx tsc -p web/tsconfig.node.json --noEmit
          (cd remotion && npx tsc --noEmit)
      - run: npm test
