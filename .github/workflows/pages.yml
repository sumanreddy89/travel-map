name: Pages

# Builds site/ (the hosted-version landing page) and pushes it to the gh-pages branch, which
# GitHub Pages serves. This avoids the Actions artifact route, which kept failing to find its own
# upload on 25 Nov 2026. The self-hosted app is not part of this and is unchanged.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/demo/*.jpg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh site/build.sh && touch _site/.nojekyll
      - name: Push _site to gh-pages
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish site/ from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
