name: Pages

# Publishes site/ (the hosted-version landing page) to GitHub Pages. The self-hosted app is not
# part of this and is unchanged.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/demo/*.jpg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}hosted/
    steps:
      - uses: actions/checkout@v4
      - run: sh site/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
